<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    background-color: #F8F9FA;
    color: #1A202C;
  }

  .hero {
    background: linear-gradient(135deg, #1E2A47, #3B4C9B);
    color: white;
    padding: 80px 24px 60px;
    text-align: center;
  }

  .hero-inner {
    max-width: 1100px;
    margin: 0 auto;
  }

  .badge {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    font-size: 14px;
    margin-bottom: 20px;
    backdrop-filter: blur(8px);
  }

  .hero h1 {
    margin: 0;
    font-size: 50px;
    line-height: 1.2;
    font-weight: 800;
  }

  .hero p {
    margin-top: 20px;
    font-size: 18px;
    color: rgba(255, 255, 255, 0.85);
  }

  .container {
    max-width: 1100px;
    margin: -30px auto 50px;
    padding: 0 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 30px;
  }

  .card {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
  }

  .section-title {
    margin-bottom: 18px;
    font-size: 24px;
    font-weight: 700;
    color: #1A202C;
  }

  .desc {
    font-size: 16px;
    line-height: 1.8;
    color: #4A5568;
  }

  .mini-list {
    margin: 20px 0 0;
    padding-left: 18px;
    font-size: 15px;
    color: #4A5568;
    line-height: 1.8;
  }

  .info-box {
    margin-top: 20px;
    padding: 18px;
    background: #E2E8F0;
    border-radius: 16px;
    border: 1px solid #CBD5E0;
    color: #2D3748;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
  }

  button,
  .upload-label {
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .primary-btn {
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    color: white;
    box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
  }

  .primary-btn:hover {
    transform: translateY(-2px);
  }

  .secondary-btn {
    background: #F3F4F6;
    color: #2B6CB0;
  }

  .secondary-btn:hover {
    background: #E2E8F0;
  }

  .upload-label {
    background: #111827;
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .upload-label:hover {
    background: #2D3748;
  }

  input[type="file"] {
    display: none;
  }

  .viewer-card {
    padding: 18px;
    background: #F9FAFB;
    border-radius: 20px;
    border: 1px solid #E5E7EB;
  }

  .viewer-area {
    min-height: 350px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(96, 165, 250, 0.1));
    border: 2px dashed #93C5FD;
    border-radius: 18px;
    padding: 16px;
  }

  #webcam-container canvas,
  #image-preview {
    max-width: 100%;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
  }

  #image-preview {
    display: none;
  }

  .status {
    margin-top: 20px;
    padding: 14px 18px;
    border-radius: 14px;
    background: #EFF6FF;
    color: #2B6CB0;
    font-size: 15px;
    line-height: 1.7;
  }

  .result-top {
    margin-top: 14px;
    font-size: 30px;
    font-weight: 800;
    color: #2D3748;
  }

  .result-sub {
    margin-top: 8px;
    font-size: 16px;
    color: #4A5568;
  }

  .result-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .result-item {
    background: #F7FAFC;
    border: 1px solid #E5E7EB;
    border-radius: 16px;
    padding: 16px;
  }

  .label-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 15px;
    font-weight: 700;
  }

  .bar-bg {
    width: 100%;
    height: 14px;
    background: #E5E7EB;
    border-radius: 999px;
    overflow: hidden;
  }

  .bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #2563EB, #60A5FA);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .footer {
    max-width: 1100px;
    margin: 0 auto 40px;
    padding: 0 20px;
    color: #A0AEC0;
    font-size: 14px;
    text-align: center;
  }

  @media (max-width: 920px) {
    .grid {
      grid-template-columns: 1fr;
    }

    .hero h1 {
      font-size: 36px;
    }

    .viewer-area {
      min-height: 300px;
    }
  }
</style>
