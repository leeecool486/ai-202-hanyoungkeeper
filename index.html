<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 웹앱</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f7f8fa;
      color: #333;
    }

    .hero {
      background: linear-gradient(135deg, #111827, #3b82f6);
      color: white;
      padding: 80px 20px;
      text-align: center;
      border-bottom-left-radius: 60px;
      border-bottom-right-radius: 60px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .badge {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 16px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .hero h1 {
      font-size: 56px;
      font-weight: 800;
      margin: 0;
    }

    .hero p {
      margin-top: 16px;
      font-size: 18px;
      line-height: 1.6;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      color: rgba(255, 255, 255, 0.85);
    }

    .container {
      max-width: 1200px;
      margin: -40px auto 80px;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }

    .section-title {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 700;
      color: #111827;
    }

    .desc {
      font-size: 16px;
      color: #4b5563;
      line-height: 1.8;
    }

    .mini-list {
      margin-top: 18px;
      padding-left: 18px;
      color: #4b5563;
      line-height: 1.8;
    }

    .info-box {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      font-size: 15px;
      color: #1e3a8a;
    }

    .controls {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-bottom: 20px;
    }

    button, .upload-label {
      border: none;
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 180px;
    }

    .primary-btn {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.3);
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 60px rgba(37, 99, 235, 0.4);
    }

    .secondary-btn {
      background: #e2e8f0;
      color: #1e40af;
    }

    .secondary-btn:hover {
      background: #cbd5e1;
    }

    .upload-label {
      background: #1e40af;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .upload-label:hover {
      background: #111827;
    }

    input[type="file"] {
      display: none;
    }

    .viewer-card {
      background: #f8fafc;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e5e7eb;
    }

    .viewer-area {
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: rgba(37, 99, 235, 0.1);
      border: 2px dashed #bfdbfe;
      padding: 14px;
    }

    #webcam-container canvas,
    #image-preview {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
    }

    #image-preview {
      display: none;
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 14px;
    }

    .result-top {
      margin-top: 12px;
      font-size: 28px;
      font-weight: 700;
      color: #111827;
    }

    .result-sub {
      margin-top: 6px;
      font-size: 14px;
      color: #6b7280;
    }

    .result-list {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .result-item {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      transition: width 0.3s ease;
    }

    .footer {
      max-width: 1100px;
      margin: 40px auto;
      text-align: center;
      font-size: 14px;
      color: #6b7280;
    }

    @media (max-width: 920px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 38px;
      }

      .viewer-area {
        min-height: 250px;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-inner">
      <div class="badge">AI 이미지 분류 프로젝트</div>
      <h1 id="app-title">과일 이미지 분류기</h1>
      <p id="app-subtitle">
        웹캠과 이미지 업로드 기능을 통해 과일 사진을 분석하고,
        어떤 과일인지 예측 결과를 보여주는 AI 웹앱입니다.
      </p>
    </div>
  </section>

  <main class="container">
    <div class="grid">
      <section class="card">
        <h2 class="section-title">프로젝트 소개</h2>
        <div class="desc" id="app-description">
          이 웹앱은 Teachable Machine으로 학습한 이미지 분류 모델을 활용하여
          사용자가 웹캠 또는 업로드한 이미지를 분석할 수 있도록 만든 서비스입니다.
        </div>

        <ul class="mini-list">
          <li>웹캠으로 실시간 분류 가능</li>
          <li>이미지 업로드로 정적 사진 분류 가능</li>
