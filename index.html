<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 웹앱</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Pretendard', 'Noto Sans KR', Arial, sans-serif;
      background: #f0f0f5;
      color: #333;
    }

    .hero {
      background: linear-gradient(135deg, #1a2a6c, #000000);
      color: white;
      padding: 80px 40px;
      text-align: center;
      border-bottom-left-radius: 50px;
      border-bottom-right-radius: 50px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .hero-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
    }

    .hero h1 {
      margin: 0;
      font-size: 48px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .hero p {
      margin-top: 16px;
      font-size: 18px;
      line-height: 1.7;
      max-width: 750px;
      margin-left: auto;
      margin-right: auto;
      color: rgba(255, 255, 255, 0.85);
    }

    .container {
      max-width: 1100px;
      margin: -40px auto 60px;
      padding: 0 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid #e2e8f0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .section-title {
      margin-bottom: 16px;
      font-size: 24px;
      font-weight: 700;
      color: #1a202c;
    }

    .desc {
      line-height: 1.8;
      font-size: 16px;
      color: #4a5568;
    }

    .mini-list {
      margin: 20px 0;
      padding-left: 20px;
      color: #4a5568;
      line-height: 1.8;
    }

    .info-box {
      margin-top: 20px;
      padding: 16px 18px;
      border-radius: 16px;
      background: #e9f2ff;
      border: 1px solid #cbd5e0;
      font-size: 15px;
      color: #3182ce;
    }

    .controls {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      justify-content: center;
    }

    button, .upload-label {
      border: none;
      border-radius: 12px;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
      min-width: 180px;
    }

    .primary-btn {
      background: linear-gradient(135deg, #1a2a6c, #4a90e2);
      color: white;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .secondary-btn {
      background: #edf2f7;
      color: #1a2a6c;
      border: 1px solid #cbd5e0;
    }

    .secondary-btn:hover {
      background: #e2e8f0;
    }

    .upload-label {
      background: #1a2a6c;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      cursor: pointer;
    }

    .upload-label:hover {
      background: #000000;
    }

    input[type="file"] {
      display: none;
    }

    .viewer-card {
      padding: 20px;
      background: #f9fafb;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
    }

    .viewer-area {
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: rgba(37, 99, 235, 0.08);
      border: 2px dashed #bfdbfe;
      padding: 20px;
    }

    #webcam-container canvas,
    #image-preview {
      max-width: 100%;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
    }

    #image-preview {
      display: none;
    }

    .status {
      margin-top: 16px;
      padding: 14px 20px;
      border-radius: 14px;
      background: #eff6ff;
      color: #3182ce;
      font-size: 15px;
    }

    .result-top {
      margin-top: 18px;
      font-size: 32px;
      font-weight: 900;
      color: #1a202c;
    }

    .result-sub {
      margin-top: 10px;
      font-size: 16px;
      color: #718096;
    }

    .result-list {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-item {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 16px;
      font-weight: 600;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #1a2a6c, #4a90e2);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .footer {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 30px;
      text-align: center;
      font-size: 14px;
      color: #718096;
    }

    @media (max-width: 920px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 40px;
      }

      .viewer-area {
        min-height
